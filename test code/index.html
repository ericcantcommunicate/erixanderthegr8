<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let Them Eat Cookies</title>
    <link rel="style.css">
    <script src="myscripts.js"></script>
    <style>
        /* General reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body styling */
        body {
            font-family: 'Arial', sans-serif;
            background-color: antiquewhite;
            color: #333;
            padding: 20px;
            text-align: center;
        }

        /* Top navigation */
        .topnav {
            background-color: #333;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .topnav a {
            padding: 14px 20px;
            text-align: center;
            color: white;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
        }

        .topnav a:hover {
            background-color: #ddd;
            color: black;
        }

        .topnav a.active {
            background-color: #4CAF50;
            color: white;
        }

        /* Fade-in animation for the content */
        .fade-in {
            opacity: 0; /* Hidden by default */
            transition: opacity 2s ease-in; /* Transition duration */
        }

        .visible {
            opacity: 1; /* Fully visible when the class is added */
        }

        /* Heading styling */
        h1 {
            font-family: 'Cursive', sans-serif;
            font-size: 4rem;
            font-weight: bold;
            color: #d2691e; /* Cookie-inspired color */
            margin: 20px 0;
        }

        /* Paragraph styling */
        p {
            font-size: 1.2rem;
            font-weight: bold;
            color: #555;
            line-height: 1.5;
            margin: 20px;
        }

        /* Responsive media queries */
        @media (max-width: 768px) {
            h1 {
                font-size: 3rem; /* Smaller font for tablets */
            }

            p {
                font-size: 1rem;
            }

            .topnav a {
                padding: 10px 15px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem; /* Smaller font for mobile */
            }

            p {
                font-size: 0.9rem;
            }

            .topnav a {
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div class="topnav fade-in">
        <a class="active" href="#home">Home</a>
        <a href="#news">Recipes</a>
        <a href="#blog">Blog</a>
        <a href="#about">About</a>
    </div>

    <!-- Heading and content -->
    <h1 class="fade-in">LET THEM EAT COOKIES</h1>
    
    <p class="fade-in">
        Welcome to Let Them Eat Cookies, your go-to destination for delicious cookie recipes, baking tips, and sweet treats. Indulge in the art of baking with us!
    </p>

    <!-- JavaScript to trigger fade-in animation -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Select all elements with the 'fade-in' class
            const fadeElements = document.querySelectorAll('.fade-in');
            
            // Add the 'visible' class to each element to trigger the fade-in effect
            fadeElements.forEach(element => {
                element.classList.add('visible');
            });
        });
    </script>
</body>
</html>
